
<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Login - NgawiFest</title>

    <!-- Bootstrap CSS -->
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css"
          rel="stylesheet">
</head>
<body class="bg-light">

    <!-- Navbar -->
    <nav class="navbar navbar-expand navbar-dark bg-success">
        <div class="container">
            <a class="navbar-brand fw-bold" href="#">NgawiFest</a>

            <div class="navbar-nav ms-auto flex-row">
                <a class="nav-link text-white px-2" href="#">Beranda</a>
                <a class="nav-link text-white px-2" href="#">Tentang</a>
                <a class="nav-link text-white px-2" href="#">Bantuan</a>
            </div>
        </div>
    </nav>

    <!-- Konten Login -->
    <main class="container py-5">
        <div class="row justify-content-center">
            <div class="col-11 col-sm-8 col-md-6 col-lg-5 col-xl-4">

                <!-- Card Login -->
                <div class="card border-0 shadow">
                    <div class="card-body p-4">

                        <h4 class="text-center fw-semibold mb-1">
                            Masuk ke NgawiFest
                        </h4>

                        <p class="text-center text-secondary small mb-4">
                            Temukan informasi dan acara menarik di NgawiFest.
                        </p>

                        <form>
                            <!-- Username -->
                            <div class="mb-3">
                                <label for="username" class="form-label small mb-1">
                                    Username
                                </label>

                                <input
                                    type="text"
                                    class="form-control"
                                    id="username"
                                    placeholder="Masukkan username"
                                >
                            </div>

                            <!-- Password -->
                            <div class="mb-3">
                                <label for="password" class="form-label small mb-1">
                                    Password
                                </label>

                                <input
                                    type="password"
                                    class="form-control"
                                    id="password"
                                    placeholder="Masukkan password"
                                >
                            </div>

                            <!-- Checkbox -->
                            <div class="form-check mb-3">
                                <input
                                    class="form-check-input"
                                    type="checkbox"
                                    id="ingatSaya"
                                >

                                <label class="form-check-label small"
                                       for="ingatSaya">
                                    Ingat saya
                                </label>
                            </div>

                            <!-- Tombol Masuk -->
                            <button type="button"
                                    class="btn btn-success w-100">
                                Masuk
                            </button>
                        </form>

                    </div>

                    <!-- Lupa Password -->
                    <div class="card-footer bg-white text-center py-3">
                        <a href="#" class="text-success small">
                            Lupa password?
                        </a>
                    </div>
                </div>

            </div>
        </div>
    </main>

    <!-- Bootstrap JS -->
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>

</body>
</html>
